# 1. RATE LIMIT ZONES

# API thông thường
limit_req_zone $binary_remote_addr
    zone=api_general:10m
    rate=10r/s;

# Login
limit_req_zone $binary_remote_addr,
    zone=auth_login:10m
    rate=5r/m;

# Refresh token
limit_req_zone $binary_remote_addr
    zone=auth_refresh:10m
    rate=10r/m;


# 2. UPSTREAM

upstream ticket_backend {
    server app:8080;
}



# 3. SERVER

server {
    listen 80;
    server_name _;

    # Khi vượt rate limit, trả HTTP 429
    limit_req_status 429;
    limit_req_log_level warn;

    # LOGIN

    location = /api/v1/auth/login {

        limit_req zone=api_general burst=20 nodelay;
        limit_req zone=auth_login burst=2 nodelay;

        proxy_pass http://ticket_backend;

        include /etc/nginx/proxy_params;
    }


    # REGISTER

    location = /api/v1/auth/register {

        limit_req zone=api_general burst=20 nodelay;
        limit_req zone=auth_register burst=1 nodelay;

        proxy_pass http://ticket_backend;

        include /etc/nginx/proxy_params;
    }


    # ---------------------------------
    # REFRESH TOKEN
    # ---------------------------------

    location = /api/v1/auth/refresh {

        limit_req zone=api_general burst=20 nodelay;
        limit_req zone=auth_refresh burst=2 nodelay;

        proxy_pass http://ticket_backend;

        include /etc/nginx/proxy_params;
    }


    # ---------------------------------
    # OTHER API
    # ---------------------------------

    location ^~ /api/ {

        limit_req zone=api_general burst=20 nodelay;

        proxy_pass http://ticket_backend;

        include /etc/nginx/proxy_params;
    }
}