server:
  port: 8080

spring:
  application:
    name: ticket_booking

  datasource:
    url: ${}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: 
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          goggle:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/"
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
          
      
