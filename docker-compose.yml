server:
  port: 8686

spring:
  application:
    name: ticket_booking

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update        # dev only — prod: validate + Flyway
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:             
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}                 
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  

  minio:
    url: ${MINIO_URL}
    public-url: ${MINIO_PUBLIC_URL}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET_NAME}

  ratelimit:
    rules:
      login:
        capacity: 20
        refill-token: 10
        refill-period-seconds: 60
      login-user:
        capacity: 5
        refill-token: 3
        refill-period-seconds: 60
      login-pair:
        capacity: 3
        refill-token: 2
        refill-period-seconds: 60
      oauth-init:
        capacity: 30
        refill-token: 15
        refill-period-seconds: 30
      oauth-callback:
        capacity: 30
        refill-token: 15
        refill-period-seconds: 30
      refresh:
        capacity: 10
        refill-token: 5
        refill-period-seconds: 60
      booking:
        capacity: 10
        refill-token: 5
        refill-period-seconds: 2
      upload:
        capacity: 5
        refill-token: 2
        refill-period-seconds: 60
      default:
        capacity: 80
        refill-token: 10
        refill-period-seconds: 1